<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13100d" />
    <meta
      name="description"
      content="Crucible: an AI board of advisors for small-business owners. It researches your decision, argues it out in two rounds, and leaves you with a recommendation, its conditions and next steps. You make the final call."
    />
    <title>Crucible — your decision, argued from five sides</title>
    <script>
      // Theme before first paint: the owner's saved choice, else the OS setting (see src/lib/theme.ts).
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('crucible.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
